# Render Blueprint: one click creates the database, the API and the website.
databases:
  - name: sakthidb-db
    plan: free

services:
  - type: web
    name: sakthidb-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py ensure_admin && gunicorn config.wsgi:application
    healthCheckPath: /api/courses/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sakthidb-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS      # your website URL, e.g. https://sakthidb-web.onrender.com
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: sakthidb-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL              # e.g. https://sakthidb-api.onrender.com/api
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
